# The dashboard is fronted by the shared Caddy already running on this host (the one
# that serves the other project). Caddy joins the external `web` network and routes to
# containers on it by hostname, so the dashboard needs no published port and no tunnel.
#
# Create the network once per host, before the first `up`:
#   docker network create web
networks:
  web:
    external: true
    name: web

services:
  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: etoro-trading-bot:latest
    container_name: trading-bot
    restart: unless-stopped

    environment:
      # The schedule assumes the US session is 16:30-23:00 local. Change this and the
      # cycle times in docker/crontab stop lining up with the market.
      TZ: ${TZ:-Europe/Sofia}
      ETORO_USER_KEY: ${ETORO_USER_KEY:?set ETORO_USER_KEY in .env}
      # Optional: skip interactive login by billing per token instead.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

    volumes:
      # The repo itself: code in, data/ and strategy/ out. Living on the host means the
      # trade history and learned rules survive image rebuilds, and a future dashboard
      # can read them directly.
      - .:/app
      # Claude's auth token and settings. A named volume so `claude login` is done once
      # and survives restarts.
      - claude-home:/home/node

    # Hard cap. Claude Code is usually a few hundred MB but can spike past 1GB on a long
    # run; without a limit an unlucky spike could make the kernel OOM-kill a neighbouring
    # container instead of this one.
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.5

    # Deliberately NOT on the `web` network — it stays on the compose default bridge.
    # `web` is shared with the other project on this host, whose internal API is
    # unauthenticated precisely because it is only reachable from that network. This
    # container is an autonomous agent with shell access; it must not be able to dial it.
    #
    # Defence in depth: the bot is an autonomous agent with shell access processing
    # untrusted input (market data, web results). It gets no extra kernel capabilities
    # and cannot escalate privileges.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Read-only web view of what the bot is doing. Deliberately a separate image and a
  # separate container from the bot: this one is reachable from the internet, so it
  # gets no Claude Code, no shell tooling, and no eToro credentials — only the data
  # files, mounted read-only.
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: etoro-trading-dashboard:latest
    container_name: trading-dashboard
    restart: unless-stopped

    environment:
      TZ: ${TZ:-Europe/Sofia}
      NODE_ENV: production

    # Secrets come from a SEPARATE file, for two reasons:
    #  1. compose does not interpolate env_file values, so a hash containing `$` cannot
    #     be silently mangled the way it would be via `environment:`.
    #  2. it keeps ETORO_USER_KEY (in .env) out of the internet-facing container.
    # required:false so compose still works before this file exists — otherwise the
    # command that GENERATES it cannot run (bin/dashboard-secrets.sh). The server
    # refuses to start without the values, so a missing file fails loudly at boot
    # rather than silently coming up unauthenticated.
    env_file:
      - path: .env.dashboard
        required: false

    volumes:
      - ./data:/data:ro
      - ./strategy:/strategy:ro

    # Joins the shared edge network under an explicit alias. Caddy reverse-proxies to
    # `trading-dashboard:8080`. The alias is spelled out rather than relying on the
    # compose service name because `dashboard` is far too generic for a network shared
    # with another project.
    networks:
      web:
        aliases:
          - trading-dashboard

    # No published port: Caddy reaches it over the `web` network, so the VPS never opens
    # a port to the internet for this. Uncomment only for local debugging.
    # ports:
    #   - "127.0.0.1:8080:8080"

    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  claude-home:
